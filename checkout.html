<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Checkout — La Perlyn</title></head><body data-solid>
<div class="page-head"><h1>Checkout</h1></div><main class="wrap" id="r" style="padding-bottom:120px"></main>
<script src="data.js"></script><script src="app.js"></script>
<script>
const c=getCart(),r=document.getElementById('r');
if(!c.length)r.innerHTML='<div class="empty"><h2>Your bag is empty</h2><a class="btn btn-solid" style="margin-top:20px" href="sarees.html">Shop Sarees</a></div>';
else{const t=totals();
r.innerHTML=`<div class="lay"><form class="fc" id="f"><h3>Shipping Details <small style="font-size:12px;color:var(--soft);font-weight:400">(* required)</small></h3><div class="fr"><input required name="firstName" placeholder="First name *"><input required name="lastName" placeholder="Last name *"></div><div class="fr"><input required type="email" name="email" placeholder="Email *"><input required type="tel" name="phone" placeholder="Phone *"></div><input required name="address" placeholder="Address *" style="margin-bottom:16px"><div class="fr"><input required name="city" placeholder="City *"><input required name="state" placeholder="State *"></div><div class="fr"><input required name="pincode" placeholder="PIN code *"><input required name="country" placeholder="Country *" value="India"></div><h3 style="margin-top:8px">Payment</h3><select name="payment"><option>Cash on Delivery</option><option>UPI</option><option>Credit / Debit Card</option></select><button class="btn btn-lav block" style="margin-top:22px">Place Order — ${money(t.total)}</button></form><div class="sum"><h3>Order Summary</h3>${c.map(l=>{const p=getProduct(l.id);return`<div class="row"><span>${p.name} × ${l.qty}</span><span>${money(p.price*l.qty)}</span></div>`}).join('')}<div class="row" style="margin-top:10px"><span>Subtotal</span><span>${money(t.sub)}</span></div><div class="row"><span>Shipping</span><span>${t.ship?money(t.ship):'Free'}</span></div><div class="row"><span>Tax (5%)</span><span>${money(t.tax)}</span></div><div class="row t"><span>Total</span><span>${money(t.total)}</span></div></div></div>`;
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const body={customer:Object.fromEntries(new FormData(e.target)),items:c.map(l=>{const p=getProduct(l.id);return{id:l.id,qty:l.qty,name:p.name,price:p.price}}),totals:t};let o;
try{const x=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!x.ok)throw 0;o=await x.json()}catch{o={id:'LP'+Date.now(),...body,status:'placed'}}
localStorage.setItem(LS.o,JSON.stringify(o));saveCart([]);location.href='order-placed.html?id='+o.id}}
</script></body></html>

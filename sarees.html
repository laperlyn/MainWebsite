  <div class="wrap nav">
    <a class="nav-logo logo-font" href="index.html">La Perlyn</a>
    <nav class="nav-center">
      <a href="index.html">Home</a>

      <a href="wishlist.html">Wishlist<span class="badge" id="wishCount">0</span></a>

<div class="page-head">
  <h1>The Saree Collection</h1>
  <p class="breadcrumb"><a href="index.html">Home</a> / All Sarees</p>
</div>

<main class="wrap" style="padding-bottom:120px;">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-cat="all">All Pieces</button>
    <button class="filter-btn" data-cat="silk">Silk</button>
    <button class="filter-btn" data-cat="cotton">Cotton</button>
    <button class="filter-btn" data-cat="linen">Linen</button>
    <button class="filter-btn" data-cat="festive">Festive</button>
    <button class="filter-btn" data-cat="wedding">Wedding</button>
  </div>
  <div class="product-grid" id="productGrid"></div>
</main>

<footer>
  <div class="wrap foot-bottom">
    <span>© 2026 La Perlyn. All rights reserved.</span>
    <a href="index.html">← Return to Home</a>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const grid = document.getElementById('productGrid');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function renderCategory(cat) {
    const list = cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === cat);
    grid.innerHTML = list.map(productCardHTML).join('');
    bindWishlistButtons(grid);
  }

  // Check URL param ?category=silk etc.
  const urlCat = new URLSearchParams(location.search).get('category') || 'all';
  filterBtns.forEach(btn => {
    if (btn.dataset.cat === urlCat) {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCategory(btn.dataset.cat);
    });
  });

  renderCategory(urlCat);
</script>
</body>
</html>

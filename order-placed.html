<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Order Placed — La Perlyn</title></head><body data-solid>
<main class="wrap" id="r"></main>
<script src="data.js"></script><script src="app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id'),r=document.getElementById('r');let o=null;
try{o=JSON.parse(localStorage.getItem(LS.o))}catch{}
if(!o||o.id!==id)r.innerHTML='<div class="empty" style="padding-top:170px"><h2>Order not found</h2><p>If you just paid, a confirmation will be sent to your email.</p><a class="btn btn-solid" style="margin-top:20px" href="index.html">Back to shop</a></div>';
else r.innerHTML=`<div class="op"><div class="ck">✓</div><h1>Thank you, ${esc(o.customer?.firstName||'')}!</h1><p style="margin-top:10px">${o.status==='paid'?'Payment received — your order is confirmed.':'Your order is confirmed. Please keep the amount ready for delivery.'}</p><p class="muted" style="margin-top:8px;letter-spacing:.05em">ORDER ID: ${esc(o.id)}</p><div class="osum">${o.items.map(i=>`<div class="row"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="row t"><span>${o.status==='paid'?'Total Paid':'Total Due'}</span><span>${money(o.totals.total)}</span></div></div><p class="muted">Delivering to ${esc(o.customer?.city||'')}, ${esc(o.customer?.state||'')} — typically 5–7 days. Keep your order ID for any queries.</p><a class="btn btn-lav" style="margin-top:30px" href="index.html">Continue Shopping</a></div>`;
</script></body></html>
